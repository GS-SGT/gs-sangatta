<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00a65a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GS Care">
<meta name="format-detection" content="telephone=no">
<title>GS Care · Sangatta Field</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --g:#00a65a; --g-d:#008a4b; --g-soft:#e6f6ee; --ink:#1b1d1f; --muted:#6b7177; --line:#eceef0; --bg:#f4f5f7; --card:#fff;
  --or:#ff8a00; --err:#e0452b; --err-soft:#fdecea; --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:150px}
.app.nonav{padding-bottom:110px}

/* HOME header */
.hd{background:var(--g);color:#fff;padding:16px 16px 56px;position:relative}
.hd-row{display:flex;align-items:center;gap:10px}
.loc{display:flex;align-items:center;gap:6px;font-size:12.5px;opacity:.92}
.loc b{font-size:15px;display:block;opacity:1}
.av{margin-left:auto;width:38px;height:38px;border-radius:50%;background:#fff;color:var(--g-d);display:grid;place-items:center;font-weight:800;font-size:13.5px;border:0;cursor:pointer}
.search{display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:11px 16px;margin-top:14px;color:var(--muted);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.search input{border:0;outline:0;flex:1;background:none;font-size:14px;color:var(--ink);min-width:0}
.hi-card{margin:-40px 16px 0;background:var(--card);border-radius:var(--r);box-shadow:0 4px 18px rgba(0,0,0,.08);padding:14px 16px;display:flex;align-items:center;gap:12px;position:relative;z-index:2}
.hi-card .bub{width:42px;height:42px;border-radius:12px;background:var(--g-soft);display:grid;place-items:center;font-size:20px;flex:none}
.hi-card div{flex:1;min-width:0}.hi-card small{color:var(--muted);font-size:12px;display:block}.hi-card b{font-size:14.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi-card .pill{background:var(--g-soft);color:var(--g-d);font-weight:700;font-size:12px;padding:5px 10px;border-radius:999px;flex:none}

/* service grid */
.sec{background:var(--card);margin-top:10px;padding:16px 12px 6px}
.sec:first-of-type{margin-top:14px}
.sec h4{margin:0 4px 12px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.sec h4 span{font-size:12px;color:var(--muted);font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 6px}
.tile{background:none;border:0;padding:4px 2px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
.tile .ico{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:25px;transition:transform .12s}
.tile:active .ico{transform:scale(.9)}
.tile span{font-size:11.5px;line-height:1.25;font-weight:600;color:#3b4045;max-width:80px}
.c-fm{background:#e5f6ec}.c-gs{background:#fff1e0}.c-lt{background:#e5f0ff}.c-mess{background:#fde8ef}.c-ta{background:#ede8fd}
.banner{margin:12px 16px 0;border-radius:var(--r);background:linear-gradient(120deg,#00a65a,#00c389);color:#fff;padding:16px;display:flex;gap:12px;align-items:center;position:relative;overflow:hidden;cursor:pointer;border:0;width:calc(100% - 32px);text-align:left}
.banner::after{content:"";position:absolute;right:-30px;bottom:-40px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.14)}
.banner b{display:block;font-size:15px}.banner small{opacity:.9;font-size:12.5px}
.banner .big{font-size:34px}
.noresult{padding:30px;text-align:center;color:var(--muted);background:var(--card);margin-top:14px}

/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{background:none;border:0;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#9aa0a6;cursor:pointer}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--g)}

/* app bar */
.bar{position:sticky;top:0;z-index:20;background:#fff;padding:10px 8px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.back{width:40px;height:40px;border-radius:50%;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.back:active{background:var(--bg)}
.bar .tt{flex:1;min-width:0}.bar .tt small{color:var(--muted);font-size:11.5px;display:block}.bar .tt b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .em{font-size:24px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;margin-right:6px}
.page{padding:12px 0}
.card{background:var(--card);padding:16px}
.card + .card{margin-top:10px}
.card h5{margin:0 0 14px;font-size:15px;font-weight:800}
.sect-title{font-size:15px;font-weight:800;margin:0;padding:16px 16px 8px;background:var(--card)}

.who{display:flex;gap:12px;align-items:center;background:var(--card);padding:14px 16px;margin-bottom:10px}
.who .av{margin:0;background:var(--g-soft);flex:none}
.who div{flex:1;min-width:0;font-size:13px;color:var(--muted)}.who div b{color:var(--ink);font-size:14.5px;display:block}
.who button.lnk{background:none;border:0;color:var(--g);font-weight:700;cursor:pointer;font-size:13px}

/* fields */
.f{margin-bottom:18px}
.f:last-child{margin-bottom:4px}
.f>label,.f>.lbl{display:block;font-weight:700;font-size:13.5px;margin-bottom:7px;color:#30353a}
.f .req{color:var(--err)}
.f .help{font-size:12px;color:var(--muted);margin-top:6px}
.in{width:100%;border:1.5px solid #e1e4e7;background:#fff;border-radius:12px;padding:12px 14px;outline:none;transition:border .15s,box-shadow .15s;-webkit-appearance:none;appearance:none;min-height:48px}
textarea.in{min-height:92px;resize:vertical}
.in:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(0,166,90,.15)}
.sfx{position:relative}.sfx .in{padding-right:70px}.sfx em{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:13px}
.f.bad .in{border-color:var(--err);background:var(--err-soft)}
.f .msg{display:none;color:var(--err);font-size:12px;margin-top:6px;font-weight:600}
.f.bad .msg{display:block}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.row2>.f{min-width:0}
input[type=date].in,input[type=time].in{min-width:0;max-width:100%;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid #e1e4e7;background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13px;transition:all .12s}
.chip.on{background:var(--g-soft);border-color:var(--g);color:var(--g-d)}
.f.bad .chip{border-color:#f0b4a9}
.sug{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
.sug::-webkit-scrollbar{display:none}
.sug button{border:1px solid var(--line);background:#f7f8f9;color:#4a5056;border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;font-weight:600;white-space:nowrap}

.grid{border:1.5px solid #e1e4e7;border-radius:14px;overflow:hidden}
.gi{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.gi:last-child{border-bottom:0}
.gi span{flex:1;font-size:13.5px}
.gi .seg{display:flex;gap:6px}
.gi .seg button{border:1.5px solid #e1e4e7;background:#fff;padding:5px 10px;border-radius:999px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer}
.gi .seg button.on{background:var(--g);border-color:var(--g);color:#fff}
.gi.sel{background:#f3fbf7}

.drop{border:1.5px dashed #c9ced3;border-radius:14px;padding:16px;text-align:center;cursor:pointer;background:#fafbfc;color:var(--muted);font-size:13px;display:block}
.drop b{color:var(--g)}
.fileprev{display:flex;align-items:center;gap:12px;border:1.5px solid #e1e4e7;border-radius:14px;padding:10px}
.fileprev img,.fileprev .pdf{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#eee;display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--err);flex:none}
.fileprev div{flex:1;min-width:0;font-size:13px}.fileprev div b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{border:0;background:var(--bg);width:32px;height:32px;border-radius:50%;cursor:pointer;flex:none}

/* CTA */
.cta{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.05)}
.cta.withnav{bottom:58px;border-top:0;box-shadow:none;background:transparent}
.cta-in{max-width:488px;margin:0 auto}
.btn{width:100%;border:0;border-radius:999px;padding:15px;font-weight:800;font-size:15px;cursor:pointer;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px}
.btn:active{background:var(--g-d)}
.btn.sec{background:#fff;color:var(--g);border:1.5px solid var(--g)}
.btn:disabled{opacity:.65}
.cta-sum{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.cta-sum b{color:var(--ink)}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex;animation:fade .2s}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;max-height:90vh;overflow:auto;padding:8px 16px calc(16px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:4px;border-radius:9px;background:#d7dadd;margin:4px auto 14px}
.sheet h3{margin:0;font-size:18px;font-weight:800}
.svc-head{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px dashed var(--line)}
.svc-head .em{font-size:26px;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none}
.svc-head small{color:var(--muted);display:block;font-size:12px}
.kv{margin:6px 0 14px}
.kv div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv dt{color:var(--muted);flex:none;max-width:45%}.kv dd{margin:0;font-weight:700;text-align:right;word-break:break-word;white-space:pre-line}
.info{display:flex;gap:10px;background:#fff8ec;border-radius:12px;padding:10px 12px;font-size:12.5px;color:#7a5a20;margin-bottom:14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}

/* done */
.done-hd{background:var(--g);color:#fff;text-align:center;padding:36px 20px 70px}
.tick{width:76px;height:76px;border-radius:50%;background:#fff;color:var(--g);display:grid;place-items:center;margin:0 auto 14px;animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.3)}}
.done-hd h2{margin:0;font-size:21px}.done-hd p{margin:6px 0 0;opacity:.9;font-size:13.5px}
.order{margin:-46px 16px 0;background:#fff;border-radius:var(--r);box-shadow:0 4px 18px rgba(0,0,0,.08);padding:16px;position:relative}
.order .top{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.order .top small{color:var(--muted);font-size:12px;display:block}.order .top b{font-size:20px;letter-spacing:.03em}
.order .top button{border:0;background:var(--g-soft);color:var(--g-d);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer}
.steps{margin:14px 0 2px;position:relative}
.st{display:flex;gap:12px;align-items:flex-start;padding-bottom:16px;position:relative}
.st:not(:last-child)::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.st.ok:not(:last-child)::before{background:var(--g)}
.st i{width:24px;height:24px;border-radius:50%;background:var(--line);flex:none;display:grid;place-items:center;font-style:normal;color:#fff;font-size:12px;font-weight:800}
.st.ok i{background:var(--g)}
.st.now i{background:#fff;border:2px solid var(--g);box-shadow:0 0 0 4px var(--g-soft)}
.st b{display:block;font-size:13.5px}.st small{color:var(--muted);font-size:12px}

/* history list */
.hist{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border-bottom:1px solid var(--line)}
.hist .em{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:21px;flex:none}
.hist div{flex:1;min-width:0}.hist b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hist small{color:var(--muted);font-size:12px}
.hist .wo{font-weight:800;font-size:12px;color:var(--g-d);background:var(--g-soft);padding:4px 9px;border-radius:999px;flex:none}
.empty{color:var(--muted);font-size:13.5px;text-align:center;padding:50px 20px;background:#fff}
.empty .big{font-size:44px;display:block;margin-bottom:8px}

.toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%) translateY(20px);background:#26292c;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:all .25s;z-index:80;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.demo{background:var(--or);color:#fff;text-align:center;font-size:11.5px;font-weight:700;padding:5px}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.intro{background:var(--g);color:#fff;padding:40px 22px 60px}
.intro h1{font-size:26px;letter-spacing:-.02em;margin:16px 0 6px;line-height:1.15}
.intro p{opacity:.92;margin:0;font-size:14px}
.logo{width:56px;height:56px;border-radius:18px;background:#fff;display:grid;place-items:center;color:var(--g)}
.intro + .page{margin-top:-36px;padding:0 12px}
.intro + .page .card{border-radius:var(--r);box-shadow:0 4px 18px rgba(0,0,0,.08)}
.linkbox{display:flex;gap:8px;margin-top:10px}
.linkbox input{flex:1;font-size:12px}
.mini{border:0;border-radius:999px;padding:0 16px;background:var(--g);color:#fff;font-weight:700;font-size:13px;cursor:pointer}
.prof-hd{background:var(--g);color:#fff;padding:22px 16px;display:flex;align-items:center;gap:14px}
.prof-hd .av{margin:0;width:56px;height:56px;font-size:19px}
.prof-hd b{font-size:17px;display:block}.prof-hd small{opacity:.9}
/* ===== v3 super-app home ===== */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-8px) rotate(var(--r,0deg))}}
@keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(3deg)}}
.anim>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.anim>*:nth-child(2){animation-delay:.05s}.anim>*:nth-child(3){animation-delay:.1s}.anim>*:nth-child(4){animation-delay:.15s}.anim>*:nth-child(5){animation-delay:.2s}.anim>*:nth-child(6){animation-delay:.25s}.anim>*:nth-child(7){animation-delay:.3s}.anim>*:nth-child(8){animation-delay:.35s}
.hero{position:relative;overflow:hidden;color:#fff;padding:14px 16px 78px;background:radial-gradient(120% 90% at 100% 0%,#3fe08f 0%,rgba(63,224,143,0) 55%),linear-gradient(160deg,#00b862 0%,#00994f 60%,#007f43 100%)}
.hero .blob{position:absolute;border-radius:50%;background:rgba(255,255,255,.09)}
.hero-top{display:flex;align-items:center;gap:10px;position:relative;z-index:2}
.hero-top .loc{background:rgba(0,0,0,.14);padding:6px 12px 6px 8px;border-radius:999px;font-size:12px}
.hero-top .loc b{display:inline;font-size:12.5px}
.bell{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;border:0;color:#fff;margin-left:auto;cursor:pointer;position:relative}
.bell i{position:absolute;top:6px;right:7px;width:9px;height:9px;border-radius:50%;background:#ff4d4f;border:2px solid #00a65a}
.hero-top .av{margin-left:0}
.headline{position:relative;z-index:2;margin:18px 0 0;font-size:25px;line-height:1.18;font-weight:800;letter-spacing:-.02em;max-width:62%}
.hl{display:inline-block;background:#ffd23f;color:#0b3d22;padding:0 8px;border-radius:8px;transform:rotate(-3deg);box-shadow:3px 3px 0 #0b3d22;animation:wob 3s ease-in-out infinite}
.hero .sub{position:relative;z-index:2;font-size:12.5px;opacity:.92;margin-top:8px;max-width:56%}
.illu{position:absolute;right:4px;top:56px;width:140px;height:140px;z-index:1}
.illu span{position:absolute;font-size:34px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.22));animation:float 3.4s ease-in-out infinite}
.illu .c{left:42px;top:34px;font-size:64px;animation-duration:4s}
.illu .s1{left:0;top:0;--r:-12deg;animation-delay:.3s}.illu .s2{right:0;top:6px;--r:10deg;animation-delay:.8s}
.illu .s3{left:4px;bottom:8px;--r:8deg;animation-delay:1.2s}.illu .s4{right:6px;bottom:0;--r:-8deg;animation-delay:.5s}
.illu .ring{position:absolute;inset:18px;border-radius:50%;border:2px dashed rgba(255,255,255,.35);animation:spin 22s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero .search{position:relative;z-index:2;margin-top:16px}

.promo{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 4px;margin-top:-58px;position:relative;z-index:3;scrollbar-width:none}
.promo::-webkit-scrollbar{display:none}
.pc{scroll-snap-align:start;flex:none;width:72%;max-width:300px;border-radius:18px;padding:14px;display:flex;align-items:center;gap:12px;border:0;cursor:pointer;text-align:left;color:#fff;box-shadow:0 8px 20px -8px rgba(0,0,0,.35);position:relative;overflow:hidden}
.pc::after{content:"";position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.16)}
.pc .pe{font-size:38px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));flex:none}
.pc b{display:block;font-size:15px;line-height:1.2}.pc small{opacity:.92;font-size:12px}
.pc .go{margin-left:auto;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;flex:none;font-weight:800}
.p1{background:linear-gradient(135deg,#ff8a00,#ff5e3a)}.p2{background:linear-gradient(135deg,#3a7bff,#6a4dff)}.p3{background:linear-gradient(135deg,#00b3a4,#0083b0)}.p4{background:linear-gradient(135deg,#e0457b,#b23fd6)}

.dash{margin:14px 16px 0;background:#fff;border-radius:18px;box-shadow:0 4px 18px rgba(0,0,0,.07);padding:12px 14px;display:flex;align-items:center;gap:12px}
.dash .wal{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
.dash .wal .ic{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#00b862,#007f43);color:#fff;display:grid;place-items:center;font-size:18px;flex:none}
.dash .wal b{display:block;font-size:16px;font-weight:800}.dash .wal small{color:var(--muted);font-size:11.5px}
.qa{display:flex;gap:12px}
.qa button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:#4a5056;cursor:pointer;position:relative}
.qa button span{width:34px;height:34px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:15px;box-shadow:0 4px 10px -3px rgba(0,166,90,.6)}
.qa .badge{position:absolute;top:-4px;right:-2px;background:#ff4d4f;color:#fff;font-size:9.5px;font-weight:800;border-radius:999px;padding:1px 5px;border:2px solid #fff}

.fav{padding:18px 12px 4px}
.fav .tiles{gap:10px 6px}
.tile{position:relative}
.tile .ico{width:58px;height:58px;border-radius:20px;font-size:28px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.06),0 6px 12px -8px rgba(0,0,0,.35);position:relative;overflow:hidden}
.tile .ico::before{content:"";position:absolute;left:6px;top:5px;width:22px;height:10px;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(-20deg)}
.tag{position:absolute;top:-4px;left:50%;transform:translateX(-62%);z-index:2;background:#1b1d1f;color:#fff;font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:999px;white-space:nowrap;border:2px solid #fff}
.tag.hot{background:#ff4d4f}.tag.new{background:#3a7bff}.tag.fast{background:#ff8a00}
.more .ico{background:#f1f3f5!important;display:grid;grid-template-columns:repeat(2,10px);gap:5px;place-content:center}
.more .ico i{width:10px;height:10px;border-radius:50%;background:#7b8187}
.more .ico::before{display:none}

.strip{margin:10px 16px 0;border-radius:14px;background:var(--g);color:#fff;padding:11px 12px;display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:600;overflow:hidden;cursor:pointer;border:0;width:calc(100% - 32px);text-align:left}
.strip .em{width:28px;height:28px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:15px;flex:none}
.strip .tx{flex:1;min-width:0;position:relative;height:18px;overflow:hidden}
.strip .tx div{position:absolute;inset:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .45s,opacity .45s}
.strip .arr{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;flex:none}

.h2{font-size:17px;font-weight:800;margin:24px 16px 10px;display:flex;align-items:center;justify-content:space-between}
.h2 small{font-size:12px;color:var(--g);font-weight:700;cursor:pointer}
.again{display:flex;gap:10px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none}
.again::-webkit-scrollbar{display:none}
.ag{flex:none;width:150px;background:#fff;border-radius:16px;padding:12px;box-shadow:0 2px 10px rgba(0,0,0,.05);border:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.ag .em{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px}
.ag b{font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:32px}
.ag small{color:var(--muted);font-size:11px}
.ag .rq{font-size:12px;font-weight:800;color:var(--g)}

.tabs{display:flex;gap:8px;overflow-x:auto;padding:0 16px 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1.5px solid #e1e4e7;background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:12.5px;cursor:pointer;display:flex;gap:6px;align-items:center;transition:all .15s}
.tabs button.on{background:#1b1d1f;border-color:#1b1d1f;color:#fff}
.explore{margin:12px 16px 0;background:#fff;border-radius:18px;padding:14px 8px 6px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.explore .tiles{gap:10px 6px}
.catcard{display:flex;align-items:center;gap:12px;padding:0 8px 12px;margin-bottom:10px;border-bottom:1px dashed var(--line)}
.catcard .big{font-size:30px}
.catcard b{display:block;font-size:14.5px}.catcard small{color:var(--muted);font-size:12px}
.results{padding:16px 12px;background:#fff;margin-top:14px}
.foot{text-align:center;color:#a3a8ad;font-size:11.5px;padding:26px 0 8px}

/* all-services sheet */
.allsec{padding:10px 0 4px}
.allsec h4{margin:0 4px 10px;font-size:14.5px;font-weight:800}

/* confetti */
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:90;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--rot));opacity:.9}}
/* ===== v4 smoothness ===== */
html{-webkit-font-smoothing:antialiased}
html{overscroll-behavior-y:none}
button{transition:transform .14s cubic-bezier(.2,.8,.2,1),background-color .15s,color .15s,border-color .15s,box-shadow .15s}
.tile:active,.pc:active,.ag:active,.btn:active,.qa button:active,.strip:active,.dash .wal:active,.av:active,.bell:active,.back:active,.tabs button:active,.nav button:active{transform:scale(.95)}
.chip:active,.gi .seg button:active,.sug button:active{transform:scale(.92)}
.tile:active .ico{transform:none}
.in{transition:border-color .18s,box-shadow .18s,background-color .18s}

/* page transitions (View Transitions API) */
::view-transition-old(root),::view-transition-new(root){animation-duration:.34s;animation-timing-function:cubic-bezier(.22,.8,.24,1);mix-blend-mode:normal}
html[data-dir=fwd]::view-transition-old(root){animation-name:vt-out-left}
html[data-dir=fwd]::view-transition-new(root){animation-name:vt-in-right}
html[data-dir=back]::view-transition-old(root){animation-name:vt-out-right;z-index:2}
html[data-dir=back]::view-transition-new(root){animation-name:vt-in-left}
html[data-dir=fade]::view-transition-old(root){animation:vt-fade-out .18s ease both}
html[data-dir=fade]::view-transition-new(root){animation:vt-fade-in .22s ease both}
@keyframes vt-in-right{from{transform:translateX(36%);opacity:0}}
@keyframes vt-out-left{to{transform:translateX(-18%);opacity:0}}
@keyframes vt-in-left{from{transform:translateX(-18%);opacity:.3}}
@keyframes vt-out-right{to{transform:translateX(40%);opacity:0}}
@keyframes vt-fade-in{from{opacity:0;transform:translateY(6px)}}
@keyframes vt-fade-out{to{opacity:0}}
.nav{view-transition-name:gsnav}
.demo{view-transition-name:gsdemo}
::view-transition-group(gsnav),::view-transition-group(gsdemo){animation-duration:0s}
/* fallback (browser lama) */
.app.ent-fwd,.app.ent-back,.app.ent-fade{animation:op-in .24s ease}
@keyframes op-in{from{opacity:0}}

/* sheet: animated open/close + drag */
.ov{transition:background-color .25s}
.ov.closing{background:rgba(0,0,0,0)!important}
.ov.closing .sheet{transform:translateY(105%)!important;transition:transform .26s cubic-bezier(.4,0,.6,1)}
.sheet{touch-action:pan-y;will-change:transform}
.sheet.drag{transition:none!important}
.sheet.snap{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.grab{cursor:grab;padding:6px 0;background-clip:content-box;height:16px;box-sizing:content-box}

/* reveal conditional fields + shake error */
.f.reveal{animation:rise .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
.f.bad.shake{animation:shake .42s}

/* sticky mini header on home */
.minihd{position:fixed;top:0;left:0;right:0;z-index:35;pointer-events:none;opacity:0;transform:translateY(-100%);transition:opacity .22s,transform .28s cubic-bezier(.2,.8,.2,1)}
.minihd.show{opacity:1;transform:none;pointer-events:auto}
.minihd-in{max-width:520px;margin:0 auto;background:var(--g);padding:10px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.minihd .search{margin:0;flex:1;padding:9px 14px;cursor:pointer}
.minihd .av{margin:0;width:36px;height:36px}

/* promo dots */
.dots{display:flex;justify-content:center;gap:5px;margin-top:8px}
.dots i{width:6px;height:6px;border-radius:9px;background:#d3d7db;transition:width .3s,background-color .3s}
.dots i.on{width:18px;background:var(--g)}
.promo{scroll-behavior:smooth}
.explore .tiles,.explore .catcard{transition:opacity .18s}
.explore.swap .tiles,.explore.swap .catcard{opacity:0}

/* send progress */
.btn .prog{position:absolute;left:0;bottom:0;height:3px;background:rgba(255,255,255,.7);width:0;transition:width 6s cubic-bezier(.1,.6,.2,1);border-radius:0 3px 3px 0}
.btn{position:relative;overflow:hidden}
.btn.going .prog{width:92%}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* mascot */
.illu{right:0!important;top:60px!important;width:160px!important;height:160px!important;z-index:1}
.hero .search{margin-top:30px!important}
.headline{margin-top:24px!important}
.illu .glow{position:absolute;left:10px;top:12px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55) 0%,rgba(255,255,255,.18) 45%,rgba(255,255,255,0) 70%)}
.illu .ring{inset:auto!important;left:6px;top:8px;width:148px;height:148px}
.mascot{position:absolute;left:50%;bottom:-6px;height:166px;width:auto;transform:translateX(-50%);filter:drop-shadow(0 10px 14px rgba(0,60,30,.35));-webkit-mask-image:linear-gradient(to bottom,#000 82%,transparent 100%);mask-image:linear-gradient(to bottom,#000 82%,transparent 100%);animation:bob 3.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}}
.illu .s1{left:-6px!important;top:30px!important;font-size:26px!important}.illu .s2{right:-2px!important;top:8px!important;font-size:26px!important}.illu .s4{right:0!important;bottom:40px!important;font-size:24px!important}
.hero .sub{font-size:14px!important;font-weight:700;opacity:1!important;letter-spacing:.01em}
/* ===== v5 mobile & performance ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100dvh}
button,a,label,input,textarea,.tile,.chip{touch-action:manipulation}
.in,.search input{font-size:16px!important}            /* cegah auto-zoom iOS */
.app{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.app.nonav{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.hero{padding-top:calc(14px + env(safe-area-inset-top))}
.bar{padding-top:calc(10px + env(safe-area-inset-top))}
.minihd-in{padding-top:calc(10px + env(safe-area-inset-top))}
.intro{padding-top:calc(40px + env(safe-area-inset-top))}
.done-hd{padding-top:calc(36px + env(safe-area-inset-top))}
.cta.withnav{bottom:calc(62px + env(safe-area-inset-bottom))}
.toast{bottom:calc(150px + env(safe-area-inset-bottom))}
body.kb .cta,body.kb .nav{transform:translateY(160%);transition:transform .2s}   /* keyboard terbuka */
body.kb .app{padding-bottom:40px}
/* tap targets ≥ 40px */
.chip{padding:10px 16px;min-height:42px}
.gi{padding:8px 10px 8px 14px;min-height:54px}
.gi .seg button{padding:9px 12px;font-size:12px;min-height:38px}
.sug button{padding:8px 13px;min-height:34px}
.back{width:44px;height:44px}
.nav button{padding:8px 0 7px;position:relative}
.nav button svg{width:24px;height:24px;padding:2px 14px;box-sizing:content-box;border-radius:999px;transition:background-color .2s}
.nav button.on svg{background:var(--g-soft)}
/* GPU-friendly animations */
.illu span,.mascot,.illu .ring,.hl{will-change:transform;backface-visibility:hidden}
.illu span{filter:none!important;text-shadow:0 5px 8px rgba(0,0,0,.18)}
.mascot{filter:none!important;-webkit-mask-image:none!important;mask-image:none!important;height:185px!important;bottom:-16px!important}
.hero.off *,.hero.off{animation-play-state:paused!important}
.pc,.dash,.hi-card,.order{contain:layout paint}
.explore,.again,.foot{content-visibility:auto;contain-intrinsic-size:auto 320px}
::view-transition-old(root),::view-transition-new(root){animation-duration:.28s}
/* mode ringan (HP spek rendah / hemat baterai) */
html.lite .illu span:not(.glow),html.lite .illu .ring{animation:none!important}
html.lite .hl{animation:none}
html.lite-pause *{animation-play-state:paused!important}
html.lite .anim>*{animation-duration:.2s}
html.lite .tile .ico,html.lite .pc,html.lite .dash{box-shadow:none}
html.lite .pc{box-shadow:0 4px 10px -6px rgba(0,0,0,.3)}
@media (max-width:360px){.headline{font-size:22px}.illu{transform:scale(.86);transform-origin:right top}.tile span{font-size:11px}.tile .ico{width:52px;height:52px}}
@media (min-width:521px){body{background:#e9ecef}.app{box-shadow:0 0 40px rgba(0,0,0,.06)}}

.hero .sub{white-space:nowrap;max-width:none!important}
.dash .wal b{white-space:nowrap}
.dash .wal small{white-space:nowrap}
@media (max-width:380px){.qa{gap:8px}.qa button{font-size:10px}.dash{padding:12px}.dash .wal .ic{width:36px;height:36px}.pc{width:80%}.pc b{font-size:14px}.headline{max-width:60%}.hero .sub{font-size:13px!important}}
body{overflow-x:clip;max-width:100%}
.hst{display:inline-block;margin-top:4px;font-size:10.5px;font-weight:700;color:#b26a00;background:#fff4e0;padding:2px 8px;border-radius:999px}
.hst.ok{color:var(--g-d);background:var(--g-soft)}
/* ===== v8 FORM — booking-style ===== */
.fbar-prog{position:absolute;left:0;right:0;bottom:-1px;height:3px;background:transparent}
.fbar-prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g),#2fd38a);border-radius:0 3px 3px 0;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.fhero{background:#fff;padding:18px 16px 14px;display:flex;gap:14px;align-items:center}
.fhero .em{width:60px;height:60px;border-radius:20px;display:grid;place-items:center;font-size:30px;flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.06)}
.fhero small{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.fhero h2{margin:2px 0 3px;font-size:19px;line-height:1.2;font-weight:800;letter-spacing:-.01em}
.fhero p{margin:0;font-size:13px;color:var(--muted)}
.fmeta{display:flex;gap:6px;overflow-x:auto;padding:0 16px 14px;background:#fff;scrollbar-width:none}
.fmeta::-webkit-scrollbar{display:none}
.fmeta span{flex:none;font-size:11.5px;font-weight:700;color:#4a5056;background:#f3f4f6;padding:6px 10px;border-radius:999px}
.fwho{display:flex;align-items:center;gap:10px;background:#fff;border-top:1px solid var(--line);padding:10px 16px;font-size:12.5px;color:var(--muted)}
.fwho .av{width:30px;height:30px;font-size:11px;margin:0;background:var(--g-soft)}
.fwho b{color:var(--ink)}
.fwho button{margin-left:auto;border:0;background:none;color:var(--g);font-weight:800;font-size:12.5px;cursor:pointer;padding:6px}
.fbanner{margin:10px 12px 0;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:13px;background:#eef6ff;color:#1d4f91}
.fbanner.draft{background:#fff7e6;color:#7a5200}
.fbanner b{display:block;font-size:13.5px}
.fbanner small{opacity:.85}
.fbanner button{margin-left:auto;flex:none;border:0;border-radius:999px;padding:8px 14px;font-weight:800;font-size:12.5px;cursor:pointer;background:#1d64d8;color:#fff}
.fbanner.draft button{background:transparent;color:#7a5200;text-decoration:underline;padding:8px 4px}
.fs{background:#fff;margin:10px 12px 0;border-radius:18px;padding:14px 14px 4px;box-shadow:0 1px 2px rgba(0,0,0,.04);scroll-margin-top:80px}
.fs>header{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.fs>header .n{width:26px;height:26px;border-radius:50%;background:#eef0f2;color:#5b6168;display:grid;place-items:center;font-size:12.5px;font-weight:800;transition:all .25s;flex:none}
.fs>header b{font-size:15.5px;font-weight:800;flex:1}
.fs>header small{font-size:11.5px;color:var(--muted);font-weight:600}
.fs.done>header .n{background:var(--g);color:#fff}
.fs.done>header .n::before{content:"✓"}
.fs.done>header .n span{display:none}
/* date & time chips */
.dts{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none;scroll-snap-type:x proximity}
.dts::-webkit-scrollbar{display:none}
.dt{flex:none;scroll-snap-align:start;min-width:62px;border:1.5px solid #e1e4e7;background:#fff;border-radius:14px;padding:8px 6px;text-align:center;cursor:pointer;line-height:1.15;position:relative}
.dt small{display:block;font-size:10.5px;font-weight:700;color:var(--muted)}
.dt b{display:block;font-size:18px;font-weight:800;margin:2px 0}
.dt em{display:block;font-style:normal;font-size:10.5px;color:var(--muted)}
.dt.on{background:var(--g);border-color:var(--g);color:#fff}
.dt.on small,.dt.on em{color:rgba(255,255,255,.85)}
.dt.more{min-width:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--g-d);border-style:dashed}
.dt.more span{font-size:18px}
.dt.more input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.dt.none{min-width:70px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:var(--muted)}
.tms .dt{min-width:auto;padding:10px 13px}
.tms .dt b{font-size:14.5px;margin:0}
.picked{font-size:12px;color:var(--g-d);font-weight:700;margin-top:2px}
/* stepper */
.stp{display:flex;align-items:center;gap:0;border:1.5px solid #e1e4e7;border-radius:14px;overflow:hidden;background:#fff;max-width:240px}
.stp button{width:52px;height:50px;border:0;background:#f6f7f8;font-size:22px;font-weight:700;color:var(--g-d);cursor:pointer;flex:none}
.stp button:disabled{color:#c5c9cd}
.stp input{flex:1;min-width:0;border:0;outline:0;text-align:center;font-size:18px!important;font-weight:800;height:50px;background:#fff}
.stp em{font-style:normal;font-size:12.5px;color:var(--muted);padding-right:12px;flex:none}
.f.bad .stp{border-color:var(--err);background:var(--err-soft)}
/* option cards */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.opt{border:1.5px solid #e1e4e7;background:#fff;border-radius:14px;padding:12px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:13px;text-align:center}
.opt span{font-size:24px}
.opt.on{border-color:var(--g);background:var(--g-soft);color:var(--g-d);box-shadow:0 0 0 3px rgba(0,166,90,.12)}
.f.bad .opt{border-color:#f0b4a9}
/* memory + phrases */
.mem{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.mem::-webkit-scrollbar{display:none}
.mem button{flex:none;border:1px dashed #b9c9bf;background:#f4faf6;color:#2c5a40;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.phr{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.phr button{border:1px solid var(--line);background:#f7f8f9;color:#4a5056;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:600;cursor:pointer}
.phr button.on{background:var(--g-soft);border-color:var(--g);color:var(--g-d)}
.cnt{font-size:11px;color:var(--muted);text-align:right;margin-top:4px}
/* photo tile */
.ph{display:flex;gap:10px}
.ph label{flex:1;border:1.5px dashed #c9ced3;border-radius:16px;padding:16px 10px;text-align:center;cursor:pointer;background:#fafbfc;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.ph label span{font-size:26px}
.ph label b{color:var(--ink);font-size:13px}
.phprev{position:relative;border-radius:16px;overflow:hidden;border:1.5px solid #e1e4e7;background:#f3f4f6}
.phprev img{display:block;width:100%;max-height:240px;object-fit:cover}
.phprev .pdfb{height:110px;display:grid;place-items:center;font-size:40px}
.phprev .bar2{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#fff;font-size:12.5px}
.phprev .bar2 b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phprev .bar2 button{border:0;background:#f3f4f6;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
.phprev .ok{position:absolute;top:10px;left:10px;background:var(--g);color:#fff;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px}
/* CTA with progress */
.fcta{display:flex;align-items:center;gap:12px}
.ring{width:44px;height:44px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:#eef0f2}.ring .fg{stroke:var(--g);stroke-linecap:round;transition:stroke-dashoffset .35s cubic-bezier(.2,.8,.2,1)}

.fnote{margin:10px 12px 0;border-radius:14px;padding:12px 14px;display:flex;gap:10px;font-size:12.5px;line-height:1.5;background:#fff8e6;color:#5c4400}
.fnote>span{font-size:18px;flex:none}
.nsearch{position:sticky;top:-8px;background:#fff;padding:6px 0 10px;z-index:2}
.nlist button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:11px 4px;border-bottom:1px solid var(--line);font-size:14.5px;text-align:left;cursor:pointer}

.sefoot{display:block;text-align:center;font-size:11.5px;color:var(--muted);padding:14px 20px 4px}

// Link pribadi: …/index.html#p=xxxxx → profil otomatis tersimpan
(function readLink(){
  const m = location.hash.match(/[#&]p=([^&]+)/);
  if(!m) return;
  try{
    const p = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')))));
    if(p && p.nama && p.hp){ S.profile = p; LS.set('profile',p); }
  }catch(e){}
  history.replaceState(null,'',location.pathname+location.search);
})();
function profileLink(p){
  const b = btoa(unescape(encodeURIComponent(JSON.stringify(p)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  return location.origin + location.pathname + location.search + '#p=' + b;
}

function updIdCard(){

  const st=document.querySelector('[data-pchoice] .chip.on')?.dataset.val||'Karyawan', isK=st==='Karyawan';

  const fsel=document.querySelector('[data-pfungsi] .chip.on')?.dataset.val||'';
  const fn=fsel==='__other__'?($('#p_fungsi_o')?.value.trim()||''):fsel;
  const hp=($('#p_hp')?.value||'').trim();
  const av=$('#idc-av'), ini=nama?initials(nama):'?';
  if(av.textContent!==ini){ av.textContent=ini; av.classList.remove('pop'); void av.offsetWidth; av.classList.add('pop'); }

  $('#idc-st').textContent=isK?'Pekerja PEP Sangatta':st;
  $('#idc-fn').textContent=fn||'—'; $('#idc-hp').textContent=hp||'—';
  const n=[1,nama,fn,/^0?8\d{7,}$/.test(hp.replace(/\D/g,''))].filter(Boolean).length;
  $('#idc-bar').style.width=(n/4*100)+'%';
  $('#idc-pt').textContent = n===4 ? 'Data lengkap — siap mulai' : n+' dari 4 data terisi';
  $('#idcard').classList.toggle('ready', n===4);
}

function saveProfile(){
  const status=document.querySelector('[data-pchoice] .chip.on')?.dataset.val||'Karyawan';
  const fsel=document.querySelector('[data-pfungsi] .chip.on')?.dataset.val||'';
  const fungsi = fsel==='__other__' ? $('#p_fungsi_o').value.trim() : fsel;
  const isK=status==='Karyawan';
  const cust = isK && $('#p_nk_mode').value==='custom';
  const p={status, custom: cust || undefined, nama: isK ? (cust ? $('#p_nk_custom').value.trim() : $('#p_nk').value) : $('#p_nama').value.trim(), perusahaan: isK?'':$('#p_perusahaan').value.trim(), fungsi, hp:normHP($('#p_hp').value)};
  const bad=[];
  if(isK && (cust ? p.nama.length<3 : !namaList().includes(p.nama))) bad.push('w_nk');
  if(!isK && !p.nama) bad.push('p_nama');
  if(!p.fungsi) bad.push('w_fungsi');
  if(!/^08\d{7,12}$/.test(p.hp)) bad.push('p_hp');
  document.querySelectorAll('#pf .f').forEach(f=>f.classList.remove('bad'));
  if(bad.length){ bad.forEach(id=>{ const el=$('#'+id); (el.classList.contains('f')?el:el.closest('.f')).classList.add('bad'); }); toast('Lengkapi profil dulu ya'); return; }
  const wasNew=!S.profile; haptic(); go(()=>{ S.profile=p; LS.set('profile',p); S.editingProfile=false; if(wasNew) S.view='home'; }, {dir:'fade'});
  toast(wasNew?'Profil tersimpan — siap request!':'Profil diperbarui ✓');
}

// Ambil status terbaru dari server (dicentang tim GS di Command Center)
let _stTs=0;
async function syncStatus(force){
  if(!API_URL) return;
  const h=LS.get('history',[]).filter(x=>x.wo && !/DEMO/.test(x.wo)).slice(0,20); if(!h.length) return;
  if(!force && Date.now()-_stTs<30000) return; _stTs=Date.now();
  try{
    const r=await fetch(API_URL+(API_URL.includes('?')?'&':'?')+'action=status&wo='+encodeURIComponent(h.map(x=>x.wo).join(',')));
    const j=await r.json(); if(!j.ok) return;
    const old=LS.get('status',{}); const merged={...old,...j.status}; LS.set('status',merged);
    if(JSON.stringify(old)!==JSON.stringify(merged) && screenKey()==='history') renderHistory();
  }catch(e){}
}

   FORM v8 — booking-style: sections, chip pickers, stepper, memory, draft
   ===================================================================== */
const SECS = {
  detail:{t:'Apa yang dibutuhkan',i:'📝'}, waktu:{t:'Kapan',i:'🗓️'}, lokasi:{t:'Di mana',i:'📍'},
  orang:{t:'Siapa',i:'👥'}, konsumsi:{t:'Konsumsi',i:'🍱'}, lampiran:{t:'Lampiran',i:'📎'}
};
const SEC_ORDER = ['detail','lokasi','waktu','orang','konsumsi','lampiran'];
function secOf(f){
  if(f.t==='file') return 'lampiran';
  if(f.k==='include_konsumsi' || (f.show && /agenda___acara|konsumsi|porsi|pemesanan|penyediaan/.test(f.k))) return S.svc.name==='Layanan Catering' ? null : 'konsumsi';
  if(/^tanggal|^waktu|^jam_|durasi/.test(f.k)) return 'waktu';
  if(/alamat|lokasi|area|tempat|^asal$|^tujuan$|lokasi_kerja/.test(f.k)) return 'lokasi';
  if(/nama_(tamu|penumpang|pengirim|penerima|pemesan)|nomor_|no__hp|^nik$|jumlah_penumpang|asal_perusahaan|total_orang|total_kamar|nomor_hp/.test(f.k)) return 'orang';
  return 'detail';
}
const PHRASES = {
  alasan_perbaikan:['Mengganggu aktivitas','Membahayakan','Sudah lama rusak','Berdampak ke unit lain'],
  deskripsi_perbaikan:['AC tidak dingin','AC bocor / menetes','Lampu mati','Stop kontak rusak','Air tidak mengalir','Kran / pipa bocor','Pintu / kunci rusak','Plafon bocor'],
  alasan_permintaan:['Barang rusak','Belum tersedia','Sudah usang','Penghuni baru'],
  keperluan:['Operasional kantor','Rapat','Kegiatan lapangan'],
  indikasi:['WC mampet','Septic tank penuh','Air naik / meluap','Bau tidak sedap'],
  ucapan:['Turut berduka cita yang mendalam','Selamat & sukses','Selamat menempuh hidup baru'],
  keterangan_pemesanan:['Tanpa seafood','Ada menu vegetarian','Disajikan di ruang rapat'],
};
const OPT_IC = {
  area_perbaikan:{'RDP':'🏠','Kantor':'🏢','Fasilitas Umum':'🌳'},
  kategori_perbaikan:{'Sipil Minor':'🧱','Electrical':'💡','Plumbing':'🚰','Furniture':'🪑','Electronic':'📺','Air Conditioner (AC)':'❄️'},
  include_konsumsi:{'Ya':'🍱','Tidak':'🚫'},
  layanan:{'Drop Off':'📍','Full Service':'🔁'},
  lokasi_mess:{'Mess Sangatta':'🏢','Mess Semberah':'🏘️','Mess Balikpapan (Room Only)':'🌆'},
  jenis_karangan_bunga:{'Dukacita':'🕊️','Pernikahan':'💍','Serah Terima Jabatan (Sertijab)':'🤝','Hari Ulang Tahun (HUT)':'🎂','__other__':'✏️'},
};
const OPT_SUB = {
  kategori_perbaikan:{'Sipil Minor':'Lantai, dinding, atap, dll','Electrical':'Lampu, MCB, stop kontak, dll','Plumbing':'Pemipaan air, WC, saluran, dll','Furniture':'Lemari, meja, buffet, dll','Electronic':'Kulkas, TV, mesin cuci, dll','Air Conditioner (AC)':'AC'},
  layanan:{'Drop Off':'Antar saja','Full Service':'Antar & tunggu / kembali'},
};
const TIMES = ['07:00','08:00','09:00','10:00','11:00','13:00','14:00','15:00','16:00','17:00','19:00'];
const MEM_SKIP = /^nik$|deskripsi|alasan|keperluan|ucapan|keterangan|indikasi|^_/;
const svcId = () => S.cat.id+':'+S.cat.services.indexOf(S.svc);
const isoAdd = (iso,n) => { const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4); return z.toISOString().slice(0,10); };
function minDateFor(f){
  if(/akhir/.test(f.k)) return S.v[f.k.replace('akhir','mulai')]||todayISO();
  if(f.k==='tanggal_check_out') return S.v.tanggal_check_in ? isoAdd(S.v.tanggal_check_in,1) : todayISO();
  if(f.k==='tanggal_kembali') return S.v.tanggal_berangkat||todayISO();
  return todayISO();
}
const fieldDone = f => { const v=S.v[f.k];
  if(f.t==='file') return !!S.files[f.k];
  if(f.t==='grid') return !!(v && Object.values(v).some(Boolean));
  if(f.t==='multi') return !!(v && v.length) && (!v.includes('__other__') || !!String(S.v[f.k+'__o']||'').trim());
  if(f.t==='choice' && v==='__other__') return !!String(S.v[f.k+'__o']||'').trim();
  if(f.k==='nik') return /^\d{16}$/.test(String(v||'').trim());
  return String(v??'').trim()!==''; };

function lbl(f,id,tag){
  const star = f.req ? ' <span class="req">*</span>' : ' <span style="color:var(--muted);font-weight:500;font-size:12px">(opsional)</span>';

}
function fieldHTML(f){
  const v = S.v[f.k] ?? '', id='f_'+f.k;
  let inner='', tag='div';
  switch(f.t){
    case 'date': {
      const min=minDateFor(f), t=todayISO(), days=[];

      inner = `<div class="dts" data-dates="${f.k}">${!f.req?`<button type="button" class="dt none ${!v?'on':''}" data-pick="${f.k}" data-val="">Tidak perlu</button>`:''}${days.map(iso=>{const d=new Date(iso+'T00:00:00');return `<button type="button" class="dt ${v===iso?'on':''}" data-pick="${f.k}" data-val="${iso}"><small>${name(iso)}</small><b>${d.getDate()}</b><em>${d.toLocaleDateString('id-ID',{month:'short'})}</em></button>`}).join('')}
        <label class="dt more"><span>📅</span>Lainnya<input type="date" data-k="${f.k}" data-repaint="1" min="${min}" value="${esc(v)}" aria-label="Pilih tanggal lain"></label></div>
        ${v?`<div class="picked">✓ ${new Date(v+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>`:''}
        ${f.k==='tanggal_check_in' && /Balikpapan/.test(S.v.lokasi_mess||'') && v && v<isoAdd(todayISO(),3) ? `<div class="warn">⚠️ Mess Balikpapan dipesan minimal H-3 dari tanggal inap. Permintaan tetap bisa dikirim, namun disesuaikan dengan ketersediaan kamar.</div>`:''}`;
      break; }
    case 'time': {
      const list = TIMES.slice(); if(v && !list.includes(v)) list.unshift(v);
      inner = `<div class="dts tms">${list.map(x=>`<button type="button" class="dt ${v===x?'on':''}" data-pick="${f.k}" data-val="${x}"><b>${x}</b></button>`).join('')}
        <label class="dt more" style="min-width:auto;padding:8px 12px;flex-direction:row;gap:6px"><span style="font-size:15px">🕒</span>Lainnya<input type="time" data-k="${f.k}" data-repaint="1" value="${esc(v)}" aria-label="Pilih jam lain"></label></div>`;
      break; }
    case 'number': {
      tag='label';
      inner = `<div class="stp"><button type="button" data-step="${f.k}" data-d="-1" ${!(+v>0)?'disabled':''} aria-label="Kurangi">−</button><input id="${id}" data-k="${f.k}" inputmode="numeric" pattern="[0-9]*" value="${esc(v)}" placeholder="0" enterkeyhint="next" autocomplete="off">${f.sfx?`<em>${esc(f.sfx)}</em>`:''}<button type="button" data-step="${f.k}" data-d="1" aria-label="Tambah">+</button></div>`;
      break; }
    case 'textarea': {
      tag='label';
      const ph = PHRASES[f.k];
      inner = `<textarea class="in" id="${id}" data-k="${f.k}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
      if(ph) inner += `<div class="phr">${ph.map(p=>`<button type="button" class="${String(v).includes(p)?'on':''}" data-phrase="${f.k}" data-val="${esc(p)}">${esc(p)}</button>`).join('')}</div>`;
      inner += memHTML(f);
      break; }
    case 'choice': case 'multi': {
      const ic=OPT_IC[f.k], sub=OPT_SUB[f.k]||{}, multi=f.t==='multi';
      const list=f.opt.concat(f.other?['__other__']:[]);
      const isOn=o=>multi?(v||[]).includes(o):v===o;
      const nm=o=>o==='__other__'?'Lainnya':o;
      if(ic) inner = `<div class="opts${sub&&Object.keys(sub).length?' subs':''}" data-choice="${f.k}" data-multi="${multi?1:0}">${list.map(o=>`<button type="button" class="chip opt ${isOn(o)?'on':''}" data-val="${esc(o)}"><span>${ic[o]||'✏️'}</span>${esc(nm(o))}${sub[o]?`<small>${esc(sub[o])}</small>`:''}</button>`).join('')}</div>`;
      else inner = `<div class="chips" data-choice="${f.k}" data-multi="${multi?1:0}">${list.map(o=>`<button type="button" class="chip ${isOn(o)?'on':''}" data-val="${esc(o)}">${o==='__other__'?'✏️ ':''}${esc(nm(o))}</button>`).join('')}</div>`;
      if(f.other && isOn('__other__')) inner += `<input class="in" style="margin-top:8px" id="f_${f.k}__o" data-k="${f.k}__o" value="${esc(S.v[f.k+'__o']||'')}" placeholder="Tulis lainnya…" autocomplete="off" enterkeyhint="next">`;
      break; }
    case 'grid': {
      const items = f.items(S.v), sel = v||{};
      inner = `<div class="grid">${items.map(it=>`<div class="gi ${sel[it]?'sel':''}"><span>${esc(it)}</span><div class="seg" data-grid="${f.k}" data-item="${esc(it)}">${GRID_OPT.map((o,i)=>`<button type="button" class="${sel[it]===o?'on':''}" data-val="${esc(o)}">${i===0?'Baru':'Remaja'}</button>`).join('')}</div></div>`).join('')}</div>`; break; }
    case 'file': {
      const fl = S.files[f.k];
      inner = fl ? `<div class="phprev">${fl.type.startsWith('image/')?`<img src="${fl.preview}" alt="">`:`<div class="pdfb">📄</div>`}<span class="ok">✓ Terlampir</span><div class="bar2"><b>${esc(fl.name)}</b><span style="color:var(--muted)">${(fl.size/1024).toFixed(0)} KB</span><button type="button" data-rmfile="${f.k}">Ganti</button></div></div>`
        : `<div class="ph"><label><span>📷</span><b>Ambil foto</b>Kamera<input type="file" data-file="${f.k}" accept="image/*" capture="environment" hidden></label><label><span>🖼️</span><b>Pilih file</b>Galeri / PDF<input type="file" data-file="${f.k}" accept="image/*,application/pdf" hidden></label></div>`;
      break; }
    default: {
      tag='label';
      const mode = f.num?'numeric':f.t==='tel'?'tel':'';
      inner = `<input class="in" id="${id}" data-k="${f.k}" type="${f.t==='tel'?'tel':'text'}" enterkeyhint="next" autocomplete="off" ${mode?`inputmode="${mode}"`:''} value="${esc(v)}" placeholder="${esc(f.ph||'')}">`;
      inner += memHTML(f);
      if(f.sug) inner += `<div class="sug">${f.sug.map(s=>`<button type="button" data-sug="${f.k}" data-val="${esc(s)}">${esc(s)}</button>`).join('')}</div>`;
    }
  }
  const msg = f.t==='grid'?'Pilih minimal satu barang':f.t==='file'?'Lampiran wajib diunggah':f.k==='nik'?'NIK harus 16 digit angka':(f.t==='date'||f.t==='time'||f.t==='choice')?'Silakan pilih salah satu':'Wajib diisi';
  return `<div class="f${f.show?' reveal':''}" data-f="${f.k}">${lbl(f,id,tag)}${inner}${f.help||f.link?`<div class="help">${esc(f.help||'')}${f.link?` <a href="${f.link[1]}" target="_blank" rel="noopener" style="color:var(--g);font-weight:700">${esc(f.link[0])} ↗</a>`:''}</div>`:''}<div class="msg">${msg}</div></div>`;
}
function memHTML(f){
  if(MEM_SKIP.test(f.k) || !['text','tel','textarea'].includes(f.t) || (f.t==='textarea' && !/alamat|lokasi|nama_/.test(f.k))) return '';
  const m=(LS.get('mem',{})[f.k]||[]).filter(x=>x && x!==S.v[f.k]).slice(0,3);
  return m.length?`<div class="mem">${m.map(x=>`<button type="button" data-sug="${f.k}" data-val="${esc(x)}">🕘 ${esc(x)}</button>`).join('')}</div>`:'';
}

function groupedFields(){
  const g={}; visibleFields().forEach(f=>{ const s=secOf(f)||'detail'; (g[s]=g[s]||[]).push(f); });
  return SEC_ORDER.filter(s=>g[s]).map(s=>({s,fields:g[s]}));
}
function secSummary(g){
  return g.fields.filter(f=>!f.k.startsWith('_') && fieldDone(f)).map(f=>{ const v=plainVal(f); return f.t==='grid' ? (v.split('\n').length+' barang') : v.replace(/\n/g,', '); }).join(' · ') || 'Tidak diisi';
}
function formBodyHTML(){
  S.col = S.col || new Set();
  return groupedFields().map((g,i)=>`<section class="fs${S.col.has(g.s)?' col':''}" data-sec="${g.s}"><header data-sechead="${g.s}"><span class="n"><span>${i+1}</span></span><b>${SECS[g.s].i} ${SECS[g.s].t}</b><small></small><span class="tg">▾</span></header><div class="sum">${esc(secSummary(g))}</div>${g.fields.map(fieldHTML).join('')}</section>`).join('');
}
function estMin(){ return Math.max(1, Math.round(visibleFields().length*7/60)); }

function renderForm(){
  const c=S.cat, s=S.svc, p=S.profile;
  const last=(LS.get('last',{})[svcId()]);
  $('#app').innerHTML = `
   <div class="bar"><button class="back" data-act="home">${IC.back}</button><div class="tt"><small>Buat request</small><b>${esc(shortName(s))}</b></div><span class="fbar-prog"><i id="pbar"></i></span></div>

   ${S._draftRestored?`<div class="fbanner draft" id="fb-draft"><span style="font-size:20px">📝</span><div><b>Melanjutkan isian sebelumnya</b><small>Tersimpan otomatis di HP ini</small></div><button data-act="resetDraft">Mulai ulang</button></div>`
     : last?`<div class="fbanner" id="fb-last"><span style="font-size:20px">↺</span><div><b>Sama seperti terakhir?</b><small>Request ${esc(last.at)} — isi otomatis, tinggal cek</small></div><button data-act="useLast">Pakai</button></div>`:''}
   ${s.note?(s.note.length>300?`<details class="fnote"><summary><span>ℹ️</span> <b>${s.note.match(/<b>(.*?)<\/b>/)[1]}</b> · ketuk untuk baca</summary><div style="margin-top:8px">${s.note.replace(/^<b>.*?<\/b><br>/,'')}</div></details>`:`<div class="fnote"><span>ℹ️</span><div>${s.note}</div></div>`):''}
   <div id="formcard">${formBodyHTML()}</div>
   <div style="height:12px"></div>
   <div class="cta"><div class="cta-in fcta">
     <div class="ring"><svg width="44" height="44"><circle class="bg" cx="22" cy="22" r="18"/><circle class="fg" id="ringfg" cx="22" cy="22" r="18" stroke-dasharray="113.1" stroke-dashoffset="113.1"/></svg><b id="ringtx">0/0</b></div>
     <button class="btn" data-act="review" id="ctaBtn"><span class="lbl2" id="ctaLbl">Lanjut</span></button>
   </div></div>`;

function rerenderForm(){ const y=window.scrollY; $('#formcard').innerHTML = formBodyHTML(); window.scrollTo(0,y); updateProgress(true); }
function refreshField(k){
  const f=S.svc.fields.find(x=>x.k===k), el=document.querySelector(`[data-f="${k}"]`);
  if(!f||!el) return;
  const sc=el.querySelector('.dts')?.scrollLeft;
  const tmp=document.createElement('div'); tmp.innerHTML=fieldHTML(f).replace(' reveal',''); const n=tmp.firstElementChild;
  el.replaceWith(n); const d=n.querySelector('.dts'); if(d && sc!=null) d.scrollLeft=sc;
  updateProgress();
}
let _wasReady=false;
function autoCollapse(cur){
  if(screenKey()!=='form' || !cur) return;
  const curId=cur.dataset.sec; let passed=false;
  document.querySelectorAll('#formcard .fs').forEach(sec=>{
    if(sec===cur){ passed=true; return; }
    if(passed || !sec.classList.contains('done') || sec.classList.contains('col')) return;
    if(sec.querySelector('.f.bad')) return;
    const id=sec.dataset.sec, g=groupedFields().find(x=>x.s===id); if(!g) return;
    const before=cur.getBoundingClientRect().top;
    S.col.add(id); sec.querySelector('.sum').textContent=secSummary(g); sec.classList.add('col');
    const after=cur.getBoundingClientRect().top; window.scrollBy(0, after-before);
  });
}
document.addEventListener('focusin',e=>{ const sec=e.target.closest?.('#formcard .fs'); if(sec) autoCollapse(sec); });
document.addEventListener('pointerdown',e=>{ const sec=e.target.closest?.('#formcard .fs'); if(sec && !e.target.closest('[data-sechead]')) autoCollapse(sec); },{passive:true});
function updateProgress(silent){
  if(screenKey()!=='form' || !$('#pbar')) return;
  const req=visibleFields().filter(f=>f.req), done=req.filter(fieldDone).length, tot=req.length, k=tot?done/tot:1;
  $('#pbar').style.width=(k*100)+'%';
  $('#ringfg').style.strokeDashoffset=String(113.1*(1-k)); $('#ringtx').textContent=done+'/'+tot;
  const ready=done===tot;
  $('#ctaLbl').innerHTML = ready ? 'Cek & kirim request' : `Lanjut<small>${tot-done} isian wajib lagi</small>`;
  if(ready && !_wasReady && !silent){ const b=$('#ctaBtn'); b.classList.remove('ready'); void b.offsetWidth; b.classList.add('ready'); haptic(10); }
  _wasReady=ready;
  groupedFields().forEach(g=>{ const sec=document.querySelector(`.fs[data-sec="${g.s}"]`); if(!sec) return;
    const r=g.fields.filter(f=>f.req), d=r.filter(fieldDone).length;
    sec.classList.toggle('done', r.length? d===r.length : g.fields.some(fieldDone));
    sec.querySelector('header small').textContent = r.length ? `${d}/${r.length}` : 'opsional';
    if(sec.classList.contains('col')) sec.querySelector('.sum').textContent = secSummary(g); });
  saveDraft();
}
let _draftT;
function saveDraft(){
  clearTimeout(_draftT);
  _draftT=setTimeout(()=>{ if(screenKey()!=='form') return;
    const touched=Object.keys(S.v).some(k=>{ const f=S.svc.fields.find(x=>x.k===k); return f && !f.today && !f.def && k!=='include_konsumsi' && fieldDone(f); });
    const all=LS.get('draft',{}); if(touched) all[svcId()]={v:S.v,ts:Date.now()}; else delete all[svcId()]; LS.set('draft',all); },400);
}

function openService(cat, svc){ haptic(); go(()=>{
  S.cat=cat; S.svc=svc; S.v={}; S.files={}; S._durManual=false; S._draftRestored=false; _wasReady=false; S.col=new Set();

}
function applyLast(){
  const last=LS.get('last',{})[svcId()]; if(!last) return;
  S.svc.fields.forEach(f=>{ if(f.t==='date'||f.t==='time'||f.t==='file') return; if(last.v[f.k]!==undefined) S.v[f.k]=JSON.parse(JSON.stringify(last.v[f.k])); });
  $('#fb-last')?.remove(); rerenderForm(); toast('Terisi seperti request terakhir — cek tanggal & jamnya ya');
}
function rememberSubmit(){
  const mem=LS.get('mem',{});
  visibleFields().forEach(f=>{ const v=String(S.v[f.k]??'').trim();
    if(!v || v==='-' || MEM_SKIP.test(f.k) || !['text','tel','textarea'].includes(f.t)) return;
    if(f.t==='textarea' && !/alamat|lokasi|nama_/.test(f.k)) return;

  const last=LS.get('last',{}); last[svcId()]={v:S.v,at:new Date().toLocaleDateString('id-ID',{day:'numeric',month:'short'})}; LS.set('last',last);
  const dr=LS.get('draft',{}); delete dr[svcId()]; LS.set('draft',dr);
}

function validate(){
  let first=null;
  document.querySelectorAll('.f.bad').forEach(e=>e.classList.remove('bad'));
  for(const f of visibleFields()){
    const v=S.v[f.k];

    if(ok && f.t==='tel' && String(v||'').trim()) ok=/^[0-9+\s-]{8,16}$/.test(String(v).trim());
    if(ok && !f.req && f.other && (f.t==='choice'? v==='__other__' : (v||[]).includes('__other__'))) ok=!!String(S.v[f.k+'__o']||'').trim();
    if(!ok){ const sec0=document.querySelector(`[data-f="${f.k}"]`)?.closest('.fs'); if(sec0&&sec0.classList.contains('col')){ sec0.classList.remove('col'); S.col.delete(sec0.dataset.sec); }

      if(f.other && (v==='__other__'||(Array.isArray(v)&&v.includes('__other__')))) el.querySelector('.msg').textContent='Tulis isian "Lainnya"';
      first=first||el; }
  }
  if(S.v.tanggal_check_in && S.v.tanggal_check_out && S.v.tanggal_check_out < S.v.tanggal_check_in){

function svcName(){ return S.svc.prl ? 'Perlengkapan RDP '+S.v._prl : S.svc.name; }

function buildPayload(){
  const p=S.profile;
  const a = {
    kategori_layanan: S.cat.name,
    nama_karyawan: p.status==='Karyawan' ? p.nama : p.status,
    nama_tkjp_mitra_kerja_tamu: p.status==='Karyawan' ? '' : p.nama,
    nama_perusahaan___asal: p.status==='Karyawan' ? '' : (p.perusahaan||''),
    fungsi: p.fungsi,
    nomor_whatsapp: p.hp,
  };
  if(S.cat.key) a[S.cat.key] = svcName();
  const files={}, grid={};
  for(const f of visibleFields()){
    if(f.k.startsWith('_')) continue;
    const v=S.v[f.k];
    if(f.t==='file'){ const fl=S.files[f.k]; if(fl) files[f.k]={name:fl.name,type:fl.type,data:fl.data}; else a[f.k]=''; continue; }
    if(f.t==='grid'){ const items=f.items(S.v), sel=v||{}; a[f.k]=items.map(it=>sel[it]||''); items.forEach(it=>{ if(sel[it]) grid[it]=sel[it]; }); continue; }
    if(f.t==='multi'){ a[f.k]=(v||[]).map(x=>x==='__other__'?String(S.v[f.k+'__o']||'').trim():x).filter(Boolean).join(', ') || '-'; continue; }
    if(f.t==='choice'){ a[f.k]= v==='__other__' ? String(S.v[f.k+'__o']||'').trim() : (v||''); continue; }
    if(f.t==='date'||f.t==='time'){ a[f.k]=v||''; continue; }
    let s=String(v??'').trim();
    if(f.sfx==='malam' && s) s += ' malam';
    a[f.k]= s || '-';
  }
  const secs=(S.svc.secs||[]).concat(S.v.include_konsumsi==='Ya'?['S14']:[]);
  return {answer:a, files, grid, secs};
}

function reviewRows(){
  const rows=[['Layanan',svcName()]];
  for(const f of visibleFields()){
    if(f.k.startsWith('_')) continue;
    const v=S.v[f.k]; let s;
    if(f.t==='file') s=S.files[f.k]?'📎 '+S.files[f.k].name:'-';
    else if(f.t==='grid') s=Object.entries(v||{}).filter(([,o])=>o).map(([i,o])=>`• ${i} — ${o}`).join('\n')||'-';
    else if(f.t==='multi') s=(v||[]).join(', ')||'-';
    else if(f.t==='date') s=fmtDate(v);
    else s=(String(v??'').trim()||'-') + (f.sfx&&v?' '+f.sfx:'');
    rows.push([f.l,s]);
  }
  return rows;
}

  const b=$('#sendbtn'); b.disabled=true; b.innerHTML='<span class="spin"></span> Mengirim…<span class="prog"></span>'; requestAnimationFrame(()=>b.classList.add('going'));
  const slow=setTimeout(()=>{ if(S.sending) b.firstChild.nextSibling.textContent=' Mengirim notifikasi WhatsApp…'; },3500);
  try{
    const payload=buildPayload(); let res;
    if(!API_URL){ await new Promise(r=>setTimeout(r,1200)); res={ok:true,wo:'WO-DEMO'}; console.log('DEMO payload',payload); }
    else{
      const r = await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
      res = await r.json();
    }
    if(!res.ok) throw new Error(res.error||'Gagal menyimpan');

    S.sending=false; hideSheetNow(); haptic([12,40,18]); go(()=>{ S.view='done'; }); setTimeout(confetti,300);
  }catch(err){
    S.sending=false; b.disabled=false; b.classList.remove('going'); b.textContent='Coba kirim lagi'; haptic([30,60,30]);
    const off=!navigator.onLine || /fetch|network|Failed/i.test(err.message||'');
    let box=$('#senderr'); if(!box){ box=document.createElement('div'); box.id='senderr'; box.className='senderr'; b.parentNode.parentNode.insertBefore(box,b.parentNode); }

/* compress image client-side → upload lebih cepat di sinyal lapangan */
function readFile(file){
  return new Promise((res,rej)=>{
    if(file.size>10*1024*1024 && !file.type.startsWith('image/')) return rej(new Error('File lebih dari 10 MB'));
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('Gagal membaca file'));
    fr.onload=()=>{
      const url=fr.result;
      if(!file.type.startsWith('image/') || file.type==='image/gif'){ return res({name:file.name,type:file.type||'application/octet-stream',size:file.size,data:url.split(',')[1],preview:url}); }
      const img=new Image();
      img.onload=()=>{
        const max=1600, sc=Math.min(1,max/Math.max(img.width,img.height));
        const cv=document.createElement('canvas'); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        const out=cv.toDataURL('image/jpeg',.82), data=out.split(',')[1];
        res({name:file.name.replace(/\.\w+$/,'')+'.jpg',type:'image/jpeg',size:Math.round(data.length*.75),data,preview:out});
      };
      img.onerror=()=>res({name:file.name,type:file.type,size:file.size,data:url.split(',')[1],preview:url});
      img.src=url;
    };
    fr.readAsDataURL(file);
  });
}

/* ===== v4 NAVIGATION (transisi halus + tombol Back HP) ===== */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const RANK = {home:0,history:0,profile:0,svc:1,form:2,done:3};
const ROOTS = ['home','history','profile'];
const scrollMem = {};
let ignorePop = false;
try{ history.scrollRestoration='manual'; }catch(e){}
const screenKey = () => (!S.profile || S.editingProfile) ? 'profile' : S.view;
const haptic = (ms=7) => { try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };

function transition(dir, cb){
  document.documentElement.dataset.dir = dir;
  if(document.startViewTransition && dir!=='none' && !REDUCED && !window.LITE){
    try{ document.startViewTransition(cb); return; }catch(e){}
  }
  cb();
  if(dir!=='none'){ const a=$('#app'); a.classList.remove('ent-fwd','ent-back','ent-fade'); void a.offsetWidth; a.classList.add('ent-'+dir); setTimeout(()=>a.classList.remove('ent-'+dir),300); }
}

function go(mutate, opt={}){
  const from = screenKey(); scrollMem[from] = window.scrollY;
  mutate();
  const to = screenKey();
  const st = history.state && history.state.gs;
  if(to==='home'){ if(st){ ignorePop=true; history.back(); } }
  else if(from==='home' || !st) history.pushState({gs:1},'');
  else history.replaceState({gs:1},'');
  const dir = opt.dir || (from===to ? 'none' : (ROOTS.includes(from)&&ROOTS.includes(to)) ? 'fade' : (RANK[to]>RANK[from] ? 'fwd':'back'));
  transition(dir, ()=>{ render(); window.scrollTo(0, to==='home' ? (scrollMem.home||0) : 0); });
}

window.addEventListener('popstate', ()=>{
  if(ignorePop){ ignorePop=false; return; }
  if($('#ov').classList.contains('show')){ closeSheet(true); return; }
  if(S.sending) { history.pushState({gs:1},''); return; }
  if(!S.profile) return;
  const from = screenKey(); scrollMem[from]=window.scrollY;
  S.view='home'; S.cat=null; S.editingProfile=false;
  if(history.state && history.state.gs){ ignorePop=true; history.back(); }
  transition(from==='home'?'none':(ROOTS.includes(from)?'fade':'back'), ()=>{ render(); window.scrollTo(0, scrollMem.home||0); });
});

  if(t.dataset.phrase){ haptic(5); const k=t.dataset.phrase, p=t.dataset.val;
    let parts=String(S.v[k]||'').split(/\s*,\s*/).map(x=>x.trim()).filter(Boolean);
    parts = parts.includes(p) ? parts.filter(x=>x!==p) : [...parts,p];
    const v=parts.join(', '); S.v[k]=v; const ta=$('#f_'+k); if(ta) ta.value=v; t.classList.toggle('on'); ta?.closest('.f').classList.remove('bad'); updateProgress(); return; }
  if(t.dataset.gosec){ closeSheet(); setTimeout(()=>document.querySelector(`.fs[data-sec="${t.dataset.gosec}"]`)?.scrollIntoView({behavior:'smooth',block:'start'}),260); return; }
  if(t.dataset.sug){ haptic(5); const k=t.dataset.sug; S.v[k]=t.dataset.val; $('#f_'+k).value=t.dataset.val; $('#f_'+k).closest('.f').classList.remove('bad'); updateProgress(); return; }
  if(t.dataset.rmfile){ delete S.files[t.dataset.rmfile]; return rerenderForm(); }

  switch(t.dataset.act){
    case 'home': if(screenKey()==='home') return window.scrollTo({top:0,behavior:'smooth'}); return go(()=>{S.view='home'; S.cat=null; S.editingProfile=false;});
    case 'history': syncStatus(true); return go(()=>{S.view='history'; S.editingProfile=false;});
    case 'svcs': return go(()=>{S.view='svc';});
    case 'toSearch': window.scrollTo({top:0,behavior:'smooth'}); setTimeout(()=>$('#q')&&$('#q').focus(),350); return;
    case 'review': return openReview();
    case 'useLast': return applyLast();
    case 'resetDraft': { const dr=LS.get('draft',{}); delete dr[svcId()]; LS.set('draft',dr); return openService(S.cat,S.svc); }
    case 'more': return openAll();
    case 'toPick': haptic(5); document.getElementById('pick')?.scrollIntoView({behavior:'smooth',block:'start'}); return;
    case 'prlPick': haptic(5); return openPrlPick();
    case 'copyLinkHome': { const l=profileLink(S.profile); navigator.clipboard?.writeText(l).then(()=>toast('Link pribadi disalin 🔗 — buka di HP lain'),()=>toast('Buka menu Profil untuk menyalin link')); return; }
    case 'closeSheet': return closeSheet();
    case 'send': return send();
    case 'editProfile': if(screenKey()==='profile') return; return go(()=>{S.editingProfile=true;});
    case 'cancelProfile': return go(()=>{S.editingProfile=false;});
    case 'copyLink': navigator.clipboard?.writeText($('#plink').value).then(()=>toast('Link disalin ✓'),()=>{$('#plink').select();toast('Tekan & tahan untuk menyalin')}); return;
    case 'copyWO': navigator.clipboard?.writeText(S.last.wo).then(()=>toast('Nomor order disalin ✓')); return;
    case 'saveProfile': return saveProfile();
    case 'pickName': return openNamePicker();
    case 'nameOther': { closeSheet(); $('#p_nk_mode').value='custom'; $('#p_nk').value=''; $('#p_nk_btn').innerHTML='<span>✏️ Isi nama sendiri</span>▾'; $('#p_nk_custom').hidden=false; $('#p_nk_help').hidden=false; $('#w_nk').classList.remove('bad'); setTimeout(()=>$('#p_nk_custom').focus(),280); updIdCard(); return; }
  }
});


document.addEventListener('input', e=>{
  if(/^p_/.test(e.target.id)) updIdCard();
  if(e.target.id==='nq'){ const q=e.target.value.toLowerCase().trim(); let n=0; document.querySelectorAll('#nlist [data-pname]').forEach(b=>{ const m=!q||b.dataset.q.includes(q); b.hidden=!m; n+=m; }); const nn=$('#nnone'); if(nn) nn.hidden=!!n; return; }
  if(e.target.id==='q'){ const q=e.target.value.toLowerCase().trim();
    if(!$('#homebody')||!$('#results')) return; $('#homebody').hidden=!!q; $('#results').hidden=!q; const hr=document.querySelector('.hero'); if(hr) hr.style.paddingBottom=q?'18px':'';
    if(q){ const all=CATS.flatMap(c=>c.services.map((s,i)=>c.id+':'+i)).filter(k=>{const x=svcBy(k);return (x.s.name+' '+(x.s.desc||'')+' '+x.c.name+' '+(SEARCH_KW[x.s.name]||'')).toLowerCase().includes(q)});
      $('#restiles').innerHTML=all.map(k=>srowHTML(k,' · '+svcBy(k).c.name)).join(''); const nr=$('#nores'); if(nr) nr.hidden=!!all.length; }
    return; }
  const k=e.target.dataset.k; if(!k) return;
  if(e.target.dataset.repaint) return;
  S.v[k]=e.target.value; e.target.closest('.f')?.classList.remove('bad');
  if(k==='durasi_menginap') S._durManual=true;
  if(e.target.closest('.stp')){ const b=e.target.closest('.stp').querySelector('[data-d="-1"]'); if(b) b.disabled=!(+e.target.value>0); }
  updateProgress();
});
document.addEventListener('change', async e=>{
  const k=e.target.dataset.k;
  if(k && e.target.dataset.repaint){ S.v[k]=e.target.value; if(k==='tanggal_check_in'||k==='tanggal_check_out'){ S._durManual=false; autoCalc(); } refreshField(k); S.svc.fields.forEach(f=>{ if(f.t==='date'&&f.k!==k) refreshField(f.k); }); if(S.v.durasi_menginap!==undefined) refreshField('durasi_menginap'); return; }
  if(k && (k==='tanggal_check_in'||k==='tanggal_check_out')){ S._durManual=false; autoCalc(); }
  const fk=e.target.dataset.file; if(!fk || !e.target.files[0]) return;
  try{ S.files[fk]=await readFile(e.target.files[0]); rerenderForm(); }catch(err){ toast(err.message); }
});
window.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });

try{ localStorage.removeItem('gscare_names'); }catch(e){}
render();
</script>
</body>
</html>
